<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Торговые идеи — NPB Markets</title>
<meta name="description" content="Торговые идеи по золоту, валютам, биткоину и S&P 500: 6 индикаторов, итог голосованием, уровни цели и стопа">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Стиль NPB Markets по стандарту invest-start.net: Montserrat в заголовках, Roboto в тексте, зелёный #009B7A */
:root {
  color-scheme: only light;
  --green: #009B7A; --green-d: #00876B; --green-soft: rgba(0, 155, 122, .12); --hero: #D7ECEA;
  --bg: #fff; --card: #F5F7F9; --white: #fff; --line: #D3DAE2;
  --text: #0A0D10; --text2: #4A5560; --text3: #8894A0;
  --buy: #009B7A; --sell: #D92D46; --hold: #8894A0;
  --buy-bg: rgba(0, 155, 122, .08); --sell-bg: rgba(217, 45, 70, .07); --hold-bg: #EEF1F4;
  --overlay: rgba(10, 13, 16, .55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.55 Roboto, "Segoe UI", Arial, sans-serif; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
.wrap { max-width: 1272px; margin: 0 auto; padding: 0 28px; }

header .wrap { height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { display: inline-flex; }
.brand-logo { height: 40px; width: auto; display: block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--green); color: #fff;
  font-weight: 600; font-size: 16px; line-height: 1.2; padding: 15px 32px; border-radius: 14px; text-decoration: none;
  transition: filter .2s, background .2s; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.nav-btn { border-radius: 999px; padding: 12px 24px; font-size: 15px; }

main.wrap { padding-bottom: 64px; }
.hero { background: var(--hero); border-radius: 40px; padding: 56px 32px 48px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.hero-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.beta { display: inline-block; font-size: 13px; font-weight: 600; color: var(--green); background: rgba(255, 255, 255, .7);
  border-radius: 30px; padding: 4px 12px; }
h1 { font: 800 40px/50px Montserrat, Roboto, sans-serif; color: #000; text-wrap: balance; }
.subtitle { font-size: 18px; line-height: 24px; color: var(--text2); text-wrap: balance; }

.form { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
.select { position: relative; }
.select-btn { width: 100%; min-height: 60px; padding: 8px 52px 8px 18px; background: var(--white); border: 1px solid var(--line);
  border-radius: 14px; text-align: left; display: flex; flex-direction: column; justify-content: center; position: relative; transition: border-color .2s; }
.select-btn:hover, .select.open .select-btn { border-color: var(--green); }
.select-btn small { font-size: 12px; color: var(--text3); line-height: 1.3; }
.select-btn span { font-size: 16px; font-weight: 500; line-height: 1.4; }
.select-btn span.ph { color: var(--text2); font-weight: 400; }
.select.empty .select-btn small { display: none; }
.caret { position: absolute; right: 20px; top: 50%; width: 10px; height: 10px; border: solid var(--text); border-width: 0 2px 2px 0;
  transform: translateY(-75%) rotate(45deg); transition: transform .2s; }
.select.open .caret { transform: translateY(-25%) rotate(-135deg); }
.menu { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: var(--white); border-radius: 16px; z-index: 30;
  box-shadow: 0 12px 32px rgba(10, 13, 16, .14); max-height: 392px; overflow-y: auto; padding: 8px 0; display: none; }
.select.open .menu { display: block; }
.opt { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 20px; text-align: left; }
.opt:hover { background: var(--card); }
.opt b { display: block; font-size: 15px; font-weight: 500; }
.opt i { display: block; font-style: normal; font-size: 13px; color: var(--text3); }
.opt .tick { margin-left: auto; color: var(--green); visibility: hidden; font-weight: 700; }
.opt.sel .tick { visibility: visible; }

.ico { position: relative; width: 36px; height: 36px; flex: none; }
.ico svg { position: absolute; width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--white); }
.ico svg:first-child { left: 0; top: 0; }
.ico svg:last-child { right: 0; bottom: 0; }
.ico.one svg { width: 36px; height: 36px; box-shadow: none; }
.ico.big { width: 48px; height: 48px; }
.ico.big svg { width: 34px; height: 34px; }
.ico.big.one svg { width: 48px; height: 48px; }

.gen { margin-top: 4px; width: 100%; }
.gen:disabled { background: #9FCFC4; cursor: default; }
.gen svg { width: 20px; height: 20px; }
.attempts { text-align: center; font-size: 13px; line-height: 18px; color: var(--text2); text-wrap: balance; }

.perks { margin-top: 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.card { background: var(--card); border-radius: 32px; }
.perk { padding: 32px 32px 45px; display: flex; flex-direction: column; gap: 24px; font-size: 18px; line-height: 24px; font-weight: 500; }
.perk-i { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); }
.perk-i svg { width: 26px; height: 26px; }

.result { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
.inst { padding: 24px 32px; display: flex; align-items: center; gap: 16px; }
.inst-name b { display: block; font: 800 24px/28px Montserrat, Roboto, sans-serif; }
.inst-name i { font-style: normal; font-size: 15px; color: var(--text2); }
.inst-price { margin-left: auto; text-align: right; }
.inst-price b { display: block; font: 800 24px/28px Montserrat, Roboto, sans-serif; }
.inst-price i { font-style: normal; font-size: 13px; color: var(--text3); }
.inst-note { display: none; }

.main-card { padding: 32px 32px 45px; display: flex; flex-direction: column; gap: 24px; }
.chart { position: relative; height: 260px; background: var(--white); border-radius: 20px; padding: 16px 12px 8px 16px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart text { font-size: 11px; fill: var(--text3); }
.tip { position: absolute; pointer-events: none; background: var(--white); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .1); display: none; }

.rec { border-radius: 20px; border: 1.5px solid var(--hold); background: var(--white); padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 16px; }
.rec.BUY { border-color: var(--buy); background: linear-gradient(var(--buy-bg), var(--buy-bg)), var(--white); }
.rec.SELL { border-color: var(--sell); background: linear-gradient(var(--sell-bg), var(--sell-bg)), var(--white); }
.rec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rec-head h2 { font: 800 24px/28px Montserrat, Roboto, sans-serif; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 13px; font-weight: 700; text-transform: uppercase; line-height: 1.4; }
.badge.solid.BUY { background: var(--buy); color: #fff; }
.badge.solid.SELL { background: var(--sell); color: #fff; }
.badge.solid.HOLD { background: var(--hold); color: #fff; }
.badge.soft.BUY { color: var(--buy); background: var(--buy-bg); }
.badge.soft.SELL { color: var(--sell); background: var(--sell-bg); }
.badge.soft.HOLD { color: var(--text2); background: var(--hold-bg); }
.conf { font-size: 14px; color: var(--text2); }
.rec p { font-size: 18px; line-height: 26px; color: var(--text); }
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.lvl { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 14px; color: var(--text2); }
.lvl b { color: var(--text); font-weight: 700; margin-left: 4px; }
.gen-at { font-size: 13px !important; line-height: 18px !important; color: var(--text3) !important; }
.deposit { align-self: center; }

.inds { padding: 12px 32px 20px; }
.ind { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.ind:last-child { border-bottom: 0; }
.ind div { flex: 1; min-width: 0; }
.ind b { display: block; font-size: 18px; line-height: 24px; font-weight: 700; }
.ind i { display: block; font-style: normal; font-size: 15px; line-height: 21px; color: var(--text2); }

.news { padding: 32px 32px 45px; display: flex; flex-direction: column; gap: 16px; }
.news h2 { font: 800 24px/28px Montserrat, Roboto, sans-serif; }
.news p { font-size: 18px; line-height: 24px; color: var(--text2); border-left: 3px solid var(--green); padding-left: 16px; }

.note { font-size: 13px; color: var(--text3); text-align: center; text-wrap: balance; }
.disc-btn { align-self: center; font-weight: 600; color: var(--green); padding: 8px 16px; border-radius: 14px; }
.disc-btn:hover { background: var(--green-soft); }

.overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); backdrop-filter: blur(6px); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.overlay.show { display: flex; }
.loading-text { color: #fff; font-size: 20px; min-height: 30px; }
.stars { width: 56px; height: 62px; }
.stars path { transform-box: fill-box; transform-origin: center; animation: pulse 1.5s ease-out infinite; }
.stars path:nth-child(2) { animation-delay: .4s; }
.stars path:nth-child(3) { animation-delay: .8s; }
@keyframes pulse { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.5); } }

.modal { background: var(--white); border-radius: 32px; max-width: 560px; width: 100%; padding: 32px 32px 40px; text-align: left;
  display: flex; flex-direction: column; gap: 20px; max-height: calc(100vh - 48px); overflow-y: auto; }
.modal h3 { font: 800 28px/34px Montserrat, Roboto, sans-serif; }
.modal .box { background: var(--card); border-radius: 16px; padding: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 12px; }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn2 { padding: 15px 28px; border-radius: 14px; background: var(--card); font-weight: 600; }
.modal.center { text-align: center; align-items: center; }
.modal.center .btns { justify-content: center; }

.error { text-align: center; color: var(--sell); }

@media (max-width: 1100px) { .perks { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 767px) {
  .wrap { padding: 0 18px; }
  header .wrap { height: 68px; }
  .brand-logo { height: 32px; }
  .nav-btn { padding: 10px 18px; font-size: 14px; }
  .hero { border-radius: 28px; padding: 32px 18px 28px; gap: 22px; }
  h1 { font-size: 30px; line-height: 38px; }
  .subtitle { font-size: 17px; line-height: 23px; }
  .perks { grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
  .perk { padding: 20px; flex-direction: row; align-items: center; gap: 16px; font-size: 17px; line-height: 23px; }
  .perk-i { width: 44px; height: 44px; flex: none; border-radius: 12px; }
  .perk-i svg { width: 20px; height: 20px; }
  .result { margin-top: 20px; gap: 12px; }
  .card { border-radius: 24px; }
  .inst { padding: 16px 18px; flex-wrap: wrap; row-gap: 10px; }
  .inst-name b, .inst-price b { font-size: 19px; line-height: 24px; }
  .inst-name i { font-size: 13px; }
  .inst-price i { display: none; }
  .inst-note { display: block; width: 100%; font-size: 13px; color: var(--text3); padding-top: 10px; border-top: 1px solid var(--line); }
  .main-card { padding: 18px 14px 28px; gap: 18px; }
  .chart { height: 190px; padding: 12px 8px 6px 10px; border-radius: 16px; }
  .rec { padding: 20px 18px 24px; gap: 12px; }
  .rec-head h2 { font-size: 20px; line-height: 26px; }
  .rec p { font-size: 17px; line-height: 24px; }
  .inds { padding: 4px 18px 10px; }
  .ind b { font-size: 17px; line-height: 23px; }
  .ind i { font-size: 14px; line-height: 20px; }
  .news { padding: 20px 18px 28px; }
  .news h2 { font-size: 20px; line-height: 26px; }
  .news p { font-size: 17px; line-height: 23px; }
  .deposit { align-self: stretch; }
  .modal { padding: 24px 20px 28px; border-radius: 24px; }
  .modal h3 { font-size: 24px; line-height: 30px; }
}
@media (prefers-reduced-motion: reduce) { .stars path { animation: none; } }
</style>
</head>

// ---------- помощники ----------
const $ = s => document.querySelector(s);

const plural = (n, one, few, many) => {

const fmtNum = (v, d) => v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d});

const store = {

function attemptsLeft() {
  const s = store.get('ai-ideas-attempts');

}

}

// ---------- выпадающие списки ----------
let DATA = null, pair = null, tf = null;
function setupSelect(root, items, onPick) {
  const btn = root.querySelector('.select-btn'), menu = root.querySelector('.menu');
  menu.innerHTML = items.map((it, i) => `<button class="opt" type="button" role="option" data-i="${i}">${it.html}<span class="tick">✓</span></button>`).join('');

    if (!o) return;

document.addEventListener('click', () => document.querySelectorAll('.select.open').forEach(s => s.classList.remove('open')));

// ---------- заставка ----------
function showLoading() {
  const box = $('#loading'), out = $('#loadingText');
  box.classList.add('show');
  document.body.style.overflow = 'hidden';
  let phrase = 0, ch = 0;
  const tick = () => {
    const p = LOADING_PHRASES[phrase % LOADING_PHRASES.length];
    out.textContent = p.slice(0, ++ch);
    if (ch < p.length) return (box.timer = setTimeout(tick, 35));
    box.timer = setTimeout(() => { phrase++; ch = 0; tick(); }, 700);
  };
  tick();
  return () => { clearTimeout(box.timer); box.classList.remove('show'); document.body.style.overflow = ''; };
}

// ---------- график ----------
function drawChart(box, points, p) {
  const W = box.clientWidth, H = box.clientHeight, padR = 64, padB = 22, padT = 8;
  const n = points.length, extra = 5;           // как у AMarkets: 5 пустых делений справа
  const xs = i => i / (n - 1 + extra) * (W - padR);
  let lo = Math.min(...points.map(x => x.c)), hi = Math.max(...points.map(x => x.c));
  const pad = (hi - lo) * .08 || hi * .001; lo -= pad; hi += pad;
  const ys = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const line = points.map((x, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(x.c).toFixed(1)}`).join('');
  const area = `${line}L${xs(n - 1).toFixed(1)},${H - padB}L0,${H - padB}Z`;
  const grid = [], labels = [];
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = ys(v);
    grid.push(`<line x1="0" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--line)"/>`);
    labels.push(`<text x="${W - padR + 8}" y="${y + 4}">${fmtNum(v, p.digits > 2 ? p.digits : p.digits === 0 ? 0 : 2)}</text>`);
  }
  const step = Math.ceil(n / (W < 500 ? 4 : 9));
  const two = v => String(v).padStart(2, '0');
  let prevDay = null;
  for (let i = 0; i < n; i += step) {
    const d = new Date(points[i].t * 1000), day = d.toDateString();
    // внутри дня подписываем время, при смене дня — дату
    const text = day === prevDay ? `${two(d.getHours())}:${two(d.getMinutes())}` : `${two(d.getDate())}.${two(d.getMonth() + 1)}`;
    prevDay = day;
    grid.push(`<line x1="${xs(i)}" x2="${xs(i)}" y1="${padT}" y2="${H - padB}" stroke="var(--line)"/>`);
    labels.push(`<text x="${xs(i)}" y="${H - 4}" text-anchor="${i ? 'middle' : 'start'}">${text}</text>`);
  }
  const lx = xs(n - 1), ly = ys(points[n - 1].c);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-label="График цены">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#009B7A" stop-opacity=".5"/><stop offset="1" stop-color="#009B7A" stop-opacity="0"/></linearGradient></defs>
    ${grid.join('')}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#009B7A" stroke-width="1.5"/>
    <circle cx="${lx}" cy="${ly}" r="9" fill="#009B7A" opacity=".25"><animate attributeName="r" values="5;12;5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="${lx}" cy="${ly}" r="4" fill="#009B7A"/>
    <line id="cx" y1="${padT}" y2="${H - padB}" stroke="#009B7A" visibility="hidden"/>
    ${labels.join('')}</svg><div class="tip"></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cx = box.querySelector('#cx');
  const move = e => {
    const r = svg.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const i = Math.max(0, Math.min(n - 1, Math.round(x / (W - padR) * (n - 1 + extra))));
    cx.setAttribute('x1', xs(i)); cx.setAttribute('x2', xs(i)); cx.setAttribute('visibility', 'visible');
    tip.innerHTML = `${fmtDate(points[i].t * 1000, true)}<br><b>${fmtPrice(points[i].c, p)}</b>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(0, xs(i) - tip.offsetWidth / 2), W - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, ys(points[i].c) - tip.offsetHeight - 12) + 'px';
  };
  const leave = () => { tip.style.display = 'none'; cx.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move, {passive: true});
  svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
}

// ---------- результат ----------
function renderResult(p, idea) {
  const r = $('#result');
  const lv = idea.levels;
  // время цены — по последней 30-минутной свече: у дневной свечи время начала дня, а не последней сделки
  const short = DATA.ideas[`${p.value}_30m`] || idea;
  // рынок закрыт, если на момент пересчёта последней свече было больше полутора часов
  const stale = new Date(DATA.updated_at) - short.last_candle * 1000 > 1.5 * 3600e3 && !['btcusd', 'ethusd'].includes(p.value);
  const priceNote = (stale ? 'Рынок закрыт, цена на ' : 'Цена на ') + fmtDate((short.last_candle + 1800) * 1000);
  const levels = idea.signal === 'HOLD'
    ? `<span class="lvl">Поддержка<b>${fmtPrice(lv.support, p)}</b></span><span class="lvl">Сопротивление<b>${fmtPrice(lv.resistance, p)}</b></span>`
    : `<span class="lvl">Вход<b>${fmtPrice(idea.current_price, p)}</b></span><span class="lvl">Цель<b>${fmtPrice(lv.target, p)}</b></span><span class="lvl">Стоп<b>${fmtPrice(lv.stop, p)}</b></span>`;
  r.innerHTML = `
    <div class="card inst">${icon(p, true)}<div class="inst-name"><b>${esc(p.pair)}</b><i>${esc(p.name)}</i></div>
      <div class="inst-price"><b>${fmtPrice(idea.current_price, p)}</b><i>${priceNote}</i></div><p class="inst-note">${priceNote}</p></div>
    <div class="card main-card">
      <div class="chart" id="chart"></div>
      <div class="rec ${idea.signal}">
        <div class="rec-head"><h2>Рекомендация</h2><span class="badge solid ${idea.signal}">${LABEL[idea.signal]}</span>
          <span class="conf">уверенность ${idea.confidence}%</span></div>
        <p>${esc(idea.conclusion)}</p>
        <div class="levels">${levels}</div>
        <p class="gen-at">Сгенерировано: ${fmtDate(idea.generated_at, true)}</p>
      </div>
      <a class="btn deposit js-tavio" href="${TAVIO_URL}" target="_blank" rel="noopener">Перейти в Tavio</a>
    </div>
    <div class="card inds">${idea.indicators.map(i => `<div class="ind"><div><b>${esc(i.title)}</b><i>${esc(i.signal)}</i></div>
      <span class="badge soft ${i.signal_direction}">${LABEL[i.signal_direction]}</span></div>`).join('')}</div>
    ${idea.news ? `<div class="card news"><h2>Анализ рыночных новостей и событий</h2><p>${esc(idea.news)}</p></div>` : ''}
    <p class="note">Цены: ${esc(DATA.source)}${['xauusd', 'xagusd', 'wti', 'brent', 'ngas'].includes(p.value) ? ', металлы и энергоносители по фьючерсам' : ''}. Котировки брокера могут немного отличаться.</p>
    <button class="disc-btn" type="button" id="discBtn">Дисклеймер</button>`;
  r.hidden = false;
  $('#perks').hidden = true;
  drawChart($('#chart'), idea.chart, p);
  regLinks();
  $('#discBtn').addEventListener('click', openDisclaimer);
  r.scrollIntoView({behavior: 'smooth', block: 'start'});
}

$('#gen').addEventListener('click', async () => {
  if (!pair || !tf) return;
  if (attemptsLeft() === 0) return openNoAttempts();
  $('#gen').disabled = true;
  const hide = showLoading();
  const started = Date.now();
  let data = null;
  try { data = await loadData(); } catch (e) { /* покажем ошибку ниже */ }
  await new Promise(res => setTimeout(res, Math.max(0, LOADING_MS - (Date.now() - started))));
  hide();
  $('#gen').disabled = false;
  const p = data && data.pairs.find(x => x.value === pair);
  const idea = data && data.ideas[`${pair}_${tf}`];
  if (!idea) {
    $('#result').hidden = false;
    $('#result').innerHTML = '<p class="error">Не удалось получить идею. Попробуйте через минуту.</p>';
    return;
  }
  useAttempt();
  renderAttempts();
  renderResult(p, idea);
});

async function loadData() {
  const r = await fetch('data/ideas.json?v=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  DATA = await r.json();
  return DATA;
}

// ---------- ссылки на регистрацию ----------
// Как на invest-start: передаём все параметры, с которыми пришёл посетитель (utm_* и прочие),
// и всегда ставим свою метку utm_2 (если utm_2 пришёл с рекламы — заменяем на нашу).
function regLinks() {
  document.querySelectorAll('a.js-reg, a.js-tavio').forEach(a => {
    const url = new URL(a.classList.contains('js-tavio') ? TAVIO_URL : REG_URL);
    new URLSearchParams(location.search).forEach((v, k) => { if (k !== 'utm_2') url.searchParams.set(k, v); });
    url.searchParams.set('utm_2', UTM_2);
    a.href = url.toString();
  });
}

// ---------- старт ----------
regLinks();
$('#perks').innerHTML = PERKS.map(t => `<div class="card perk"><span class="perk-i"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.4 6.6L21 10l-6.6 2.4L12 19l-2.4-6.6L3 10l6.6-2.4z"/></svg></span>${esc(t)}</div>`).join('');
renderAttempts();
loadData().then(d => {
  setupSelect($('#pairSel'), d.pairs.map(p => ({value: p.value, label: p.pair,
    html: `${icon(p)}<span><b>${esc(p.pair)}</b><i>${esc(p.name)}</i></span>`})), v => {
    pair = v; $('#gen').disabled = !(pair && tf);
  });
  const pickTf = setupSelect($('#tfSel'), d.timeframes.map(t => ({value: t.timeframe, label: t.label,
    html: `<span><b>${esc(t.label)}</b></span>`})), v => {
    tf = v; $('#gen').disabled = !(pair && tf);
  });
  pickTf(0);
}).catch(() => {
  $('#attempts').textContent = 'Не удалось загрузить список инструментов. Обновите страницу.';
});
</script>
